<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Love 🫶</title>

  <link rel="stylesheet" href="valentine.css" />
</head>

<body>

  <center>

    <div id="valentineQuestion">
      <b>bây bi đi chơi cùng anh nhíe 💖</b>
    </div>

    <button class="answerButton" onclick="sendMail()">
      Âu kếch
    </button>

    <button class="answerButton" id="noButton">
      Khồngggggg
    </button>

    <br><br>

    <img
      src="https://media.giphy.com/media/3ndAvMC5LFPNMCzq7m/giphy.gif?cid=82a1493bzubzr6rf595z9obsvsmd5ieq13iiszurjg38z3la&ep=v1_gifs_trending&rid=giphy.gif&ct=g"
      alt="cat"
      class="responsive"
    />

  </center>

  <!-- EMAILJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>

    // Khởi tạo EmailJS
    emailjs.init("_5gTYYeDHpz4pJYrQ");

    // Nút Khồnggggg làm nút đồng ý to dần
    document
      .getElementById("noButton")
      .addEventListener("click", function () {

        const yesButton = document.querySelector(
          'button[onclick="sendMail()"]'
        );

        const currentFontSize = parseInt(
          window.getComputedStyle(yesButton).fontSize
        );

        yesButton.style.fontSize =
          currentFontSize + 10 + "px";

      });

    // Hàm gửi mail
    function sendMail() {

      const templateParams = {

        girl_name: "Bé iu",

        date_choice:
          "Đã đồng ý đi chơi với anh 💕"

      };

      // Disable nút tránh spam
      const buttons =
        document.querySelectorAll("button");

      buttons.forEach(btn => {

        btn.disabled = true;

      });

      emailjs.send(
        "service_5pdh7mi",
        "template_s845ep8",
        templateParams
      )

      .then(function(response) {

        console.log("SUCCESS", response);

        alert("Anh biết em sẽ đồng ý mà 😘");

        // Delay để mail gửi xong
        setTimeout(() => {

          window.location.href = "ngaydate.html";

        }, 1500);

      })

      .catch(function(error) {

        console.log("FAILED", error);

        alert("Gửi mail thất bại 😭");

        // Mở lại nút nếu lỗi
        buttons.forEach(btn => {

          btn.disabled = false;

        });

      });

    }

  </script>

</body>

</html>
